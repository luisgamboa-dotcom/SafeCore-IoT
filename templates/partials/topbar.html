<!-- Barra superior compartida: mismo color vidrio y botón que el dashboard.
     Contexto: page_title (texto). Requiere sidebarToggle.js para el botón. -->
<header class="bg-white/85 backdrop-blur-md border-b border-outline-variant flex items-center gap-3 h-16 px-4 md:px-8 flex-shrink-0 z-20">
  <button id="sidebarToggle" aria-label="Mostrar u ocultar menú" class="p-2 rounded-lg border border-outline-variant text-primary hover:bg-surface-container-low transition-colors">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <div class="font-semibold text-lg text-primary">{{ page_title }}</div>
  <div class="ml-auto flex items-center gap-3">
    {% if es_premium %}
    <a href="/dashboard/notificaciones" class="p-2 text-on-surface-variant hover:text-primary transition-colors relative" aria-label="Notificaciones">
      <span class="material-symbols-outlined">notifications</span>
      {% if notificaciones_no_leidas %}
      <span id="badgeNotificaciones" class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1.5 rounded-full bg-error text-white text-[11px] font-bold flex items-center justify-center">{{ notificaciones_no_leidas }}</span>
      {% endif %}
    </a>
    {% endif %}
    <a href="/users/perfil" class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold" aria-label="Mi perfil">{{ iniciales }}</a>
  </div>
</header>
{% if es_premium %}{% include "partials/popupAlertas.html" %}{% endif %}
