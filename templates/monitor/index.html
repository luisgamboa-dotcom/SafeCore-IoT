{% extends "layout.html" %}
{% block content %}
    <link rel="stylesheet" href="/public/styles/usbStyles.css">
    <h1>Monitor del dispositivo en vivo</h1>
    <p>
        Muestra las lecturas que el Wemos envía <strong>por Wi-Fi</strong>
        (se guardan en la base y se refrescan solas cada 2 segundos).
    </p>
    <div class="usb-status">
        <span id="usb-dot" class="usb-dot"></span>
        <span id="usb-status-text">Conectando…</span>
    </div>
    <table border="1" cellpadding="6">
        <tr><th>Fecha/hora</th><th>Dispositivo</th><th>Magnitud</th><th>Valor</th><th>Calidad</th></tr>
        <tbody id="usb-rows">
            <tr><td colspan="5">Esperando datos…</td></tr>
        </tbody>
    </table>
    <script src="/public/scripts/usbScripts.js"></script>
{% endblock %}
