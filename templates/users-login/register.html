<!DOCTYPE html>
<html class="light" lang="es">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Registro SafeCore IoT</title>
        <link rel="icon" type="image/png" href="/public/images/logo-icon.png">
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "on-surface-variant": "#43474e",
                            "inverse-primary": "#C9B0FF",
                            "tertiary-fixed": "#E5DBFF",
                            "surface-container-lowest": "#ffffff",
                            "on-secondary-container": "#fffbff",
                            "secondary-fixed": "#EDE6FF",
                            "secondary-container": "#A37FFF",
                            "inverse-surface": "#2d3134",
                            "on-tertiary": "#ffffff",
                            "tertiary-fixed-dim": "#C4AFFF",
                            "surface-bright": "#F6F1FF",
                            "primary-fixed-dim": "#C9B0FF",
                            "primary-fixed": "#E9DEFF",
                            "primary-container": "#8751F8",
                            "error": "#ba1a1a",
                            "surface-container": "#E9DEFF",
                            "surface-tint": "#7A5CA8",
                            "outline": "#74777f",
                            "background": "#F6F1FF",
                            "on-tertiary-fixed": "#2E1B5A",
                            "secondary-fixed-dim": "#D5C2FF",
                            "on-secondary-fixed-variant": "#6D3DF5",
                            "on-primary-container": "#D9C8FF",
                            "secondary": "#6D3DF5",
                            "on-primary-fixed-variant": "#4A357A",
                            "on-secondary-fixed": "#2E1B5A",
                            "outline-variant": "#c4c6cf",
                            "on-surface": "#191c1f",
                            "tertiary": "#3D2A63",
                            "error-container": "#ffdad6",
                            "on-background": "#191c1f",
                            "on-secondary": "#ffffff",
                            "surface-variant": "#D9C9FF",
                            "on-primary-fixed": "#2E1B5A",
                            "on-error": "#ffffff",
                            "on-error-container": "#93000a",
                            "tertiary-container": "#5B4A8A",
                            "on-primary": "#ffffff",
                            "surface-container-low": "#EFE7FF",
                            "primary": "#2E1B5A",
                            "surface-container-high": "#E2D5FF",
                            "surface-dim": "#d8dade",
                            "surface-container-highest": "#D9C9FF",
                            "inverse-on-surface": "#eff1f5",
                            "surface": "#F6F1FF",
                            "on-tertiary-fixed-variant": "#4A357A",
                            "on-tertiary-container": "#A37FFF"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "gutter": "24px",
                            "container-max": "1280px",
                            "stack-xl": "64px",
                            "margin-desktop": "40px",
                            "stack-lg": "32px",
                            "stack-md": "16px",
                            "stack-xs": "4px",
                            "stack-sm": "8px",
                            "margin-mobile": "16px"
                        },
                        "fontFamily": {
                            "body-lg": ["Inter"],
                            "headline-sm": ["Inter"],
                            "label-sm": ["Inter"],
                            "label-md": ["Inter"],
                            "display-lg-mobile": ["Inter"],
                            "display-lg": ["Inter"],
                            "headline-md": ["Inter"],
                            "body-md": ["Inter"]
                        },
                        "fontSize": {
                            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                            "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                            "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                            "display-lg-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "headline-md": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
        <!-- TopNavBar suprimido por el carácter transaccional de la página (Registro) -->
        <main class="flex-grow flex items-center justify-center py-stack-xl px-gutter relative overflow-hidden">
            <!-- Efecto de fondo ambiental -->
            <div class="absolute inset-0 z-0 pointer-events-none" style="background-image: radial-gradient(circle at top right, rgba(135, 81, 248, 0.05) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(96, 99, 238, 0.03) 0%, transparent 40%);">
                <div class="absolute inset-0 opacity-[0.02] bg-[radial-gradient(#2E1B5A_1px,transparent_1px)] [background-size:16px_16px]"></div>
            </div>
            <!-- Tarjeta de registro -->
            <div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_10px_30px_rgba(135,81,248,0.05)] border border-surface-container-highest p-stack-lg relative z-10">
                <!-- Encabezado -->
                <div class="text-center mb-stack-lg">
                    <a href="/home" aria-label="SafeCore IoT inicio" class="inline-block">
                        <img alt="SafeCore IoT" class="h-32 w-auto mx-auto mb-stack-md object-contain" style="max-width:230px" src="/public/images/logo-vertical.png" />
                    </a>
                    <h1 class="font-headline-md text-headline-md text-primary mb-stack-sm">Crear cuenta</h1>
                    <p class="font-body-md text-body-md text-on-surface-variant">Regístrate para acceder al sistema SafeCore IoT</p>
                </div>
                <!-- Form: campos según tabla safecore_iot.usuarios (avisos en ventana flotante) -->
                {% include "partials/toast.html" %}
                <form action="/users/register" class="space-y-stack-md" method="POST">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
                        <div class="space-y-stack-xs">
                            <label class="block font-label-md text-label-md text-on-surface" for="nombre">Nombre</label>
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="nombre" name="nombre" maxlength="50" required type="text" value="{{ old.nombre or '' }}" />
                        </div>
                        <div class="space-y-stack-xs">
                            <label class="block font-label-md text-label-md text-on-surface" for="apellido">Apellido</label>
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="apellido" name="apellido" maxlength="50" required type="text" value="{{ old.apellido or '' }}" />
                        </div>
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="email">Correo electrónico</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="email" name="email" maxlength="254" required type="email" value="{{ old.email or '' }}" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="telefono">Teléfono (opcional)</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="telefono" name="telefono" maxlength="20" type="tel" value="{{ old.telefono or '' }}" placeholder="+56 9 1234 5678" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
                        <div class="relative">
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="password" name="password" minlength="8" maxlength="254" required type="password" />
                        </div>
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirmar contraseña</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="254" required type="password" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="id_organizacion">Organización (opcional)</label>
                        <select class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="id_organizacion" name="id_organizacion">
                            <option value="" selected="">Sin organización (uso personal)</option>
                        </select>
                    </div>
                    <div class="pt-stack-sm">
                        <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all hover:-translate-y-[1px]" type="submit">
                            Crear cuenta
                        </button>
                    </div>
                </form>
                <div class="mt-stack-lg text-center">
                    <p class="font-body-md text-body-md text-on-surface-variant">
                        ¿Ya tienes una cuenta?
                        <a class="font-label-md text-label-md text-primary-container hover:text-secondary-container transition-colors ml-1" href="/users/login">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </main>
        <!-- Footer suprimido por el carácter transaccional de la página (Registro) -->
        <script src="/public/scripts/sidebarToggle.js"></script>
    </body>
</html>
