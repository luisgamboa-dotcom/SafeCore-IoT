<!DOCTYPE html>
<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>SafeCore IoT Registration</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "on-surface-variant": "#43474e",
                            "inverse-primary": "#adc7f7",
                            "tertiary-fixed": "#c9e6ff",
                            "surface-container-lowest": "#ffffff",
                            "on-secondary-container": "#fffbff",
                            "secondary-fixed": "#e1e0ff",
                            "secondary-container": "#6063ee",
                            "inverse-surface": "#2d3134",
                            "on-tertiary": "#ffffff",
                            "tertiary-fixed-dim": "#89ceff",
                            "surface-bright": "#f7f9fd",
                            "primary-fixed-dim": "#adc7f7",
                            "primary-fixed": "#d6e3ff",
                            "primary-container": "#1a365d",
                            "error": "#ba1a1a",
                            "surface-container": "#eceef2",
                            "surface-tint": "#455f88",
                            "outline": "#74777f",
                            "background": "#f7f9fd",
                            "on-tertiary-fixed": "#001e2f",
                            "secondary-fixed-dim": "#c0c1ff",
                            "on-secondary-fixed-variant": "#2f2ebe",
                            "on-primary-container": "#86a0cd",
                            "secondary": "#4648d4",
                            "on-primary-fixed-variant": "#2d476f",
                            "on-secondary-fixed": "#07006c",
                            "outline-variant": "#c4c6cf",
                            "on-surface": "#191c1f",
                            "tertiary": "#002336",
                            "error-container": "#ffdad6",
                            "on-background": "#191c1f",
                            "on-secondary": "#ffffff",
                            "surface-variant": "#e0e2e6",
                            "on-primary-fixed": "#001b3c",
                            "on-error": "#ffffff",
                            "on-error-container": "#93000a",
                            "tertiary-container": "#003a55",
                            "on-primary": "#ffffff",
                            "surface-container-low": "#f2f4f8",
                            "primary": "#002045",
                            "surface-container-high": "#e6e8ec",
                            "surface-dim": "#d8dade",
                            "surface-container-highest": "#e0e2e6",
                            "inverse-on-surface": "#eff1f5",
                            "surface": "#f7f9fd",
                            "on-tertiary-fixed-variant": "#004c6e",
                            "on-tertiary-container": "#1ba9ed"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "gutter": "24px",
                            "container-max": "1280px",
                            "stack-xl": "64px",
                            "margin-desktop": "40px",
                            "stack-lg": "32px",
                            "stack-md": "16px",
                            "stack-xs": "4px",
                            "stack-sm": "8px",
                            "margin-mobile": "16px"
                        },
                        "fontFamily": {
                            "body-lg": ["Inter"],
                            "headline-sm": ["Inter"],
                            "label-sm": ["Inter"],
                            "label-md": ["Inter"],
                            "display-lg-mobile": ["Inter"],
                            "display-lg": ["Inter"],
                            "headline-md": ["Inter"],
                            "body-md": ["Inter"]
                        },
                        "fontSize": {
                            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                            "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                            "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                            "display-lg-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "headline-md": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
        <!-- Suppressed TopNavBar due to transactional page intent (Registration) -->
        <main class="flex-grow flex items-center justify-center py-stack-xl px-gutter relative overflow-hidden">
            <!-- Ambient Background Effect -->
            <div class="absolute inset-0 z-0 pointer-events-none" style="background-image: radial-gradient(circle at top right, rgba(26, 54, 93, 0.05) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(96, 99, 238, 0.03) 0%, transparent 40%);">
                <div class="absolute inset-0 opacity-[0.02] bg-[radial-gradient(#002045_1px,transparent_1px)] [background-size:16px_16px]"></div>
            </div>
            <!-- Registration Card -->
            <div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_10px_30px_rgba(26,54,93,0.05)] border border-surface-container-highest p-stack-lg relative z-10">
                <!-- Header -->
                <div class="text-center mb-stack-lg">
                    <img alt="SafeCore Logo" class="h-16 mx-auto mb-stack-md rounded-lg object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XT6t4RjaetbiNq6SSoZW6t1_dOQbWH8aKOVIyjMdnU_irfRgxPezzjTas3Rq-KFJ7le-JQL2pvPhjeBVM_v6tDj-Xq1sr6duO9HuGgnG446j7HD7kLXU7m8X2Oz3JbVLU4spKm-toKTOQsFbyr1dvA93JEI9w4wTSabtsuEaySX1jcqb4UNepRfCsFTKox5RmMdguxW5FXjj61i-_DNJMI_lUUbd85Q6Q8zfCdYe5qRTzO9eXAEikUdKg" />
                    <h1 class="font-headline-md text-headline-md text-primary mb-stack-sm">Create Account</h1>
                    <p class="font-body-md text-body-md text-on-surface-variant">Register for SafeCore IoT System Access</p>
                </div>
                <!-- Form: campos según tabla safecore_iot.usuarios -->
                <form action="/users/register" class="space-y-stack-md" method="POST">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
                        <div class="space-y-stack-xs">
                            <label class="block font-label-md text-label-md text-on-surface" for="nombre">First Name</label>
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="nombre" name="nombre" maxlength="50" required="" type="text" />
                        </div>
                        <div class="space-y-stack-xs">
                            <label class="block font-label-md text-label-md text-on-surface" for="apellido">Last Name</label>
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="apellido" name="apellido" maxlength="50" type="text" />
                        </div>
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="email" name="email" maxlength="254" required="" type="email" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="telefono">Phone (optional)</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="telefono" name="telefono" maxlength="20" type="tel" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
                        <div class="relative">
                            <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="password" name="password" minlength="8" maxlength="254" required="" type="password" />
                        </div>
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
                        <input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="254" required="" type="password" />
                    </div>
                    <div class="space-y-stack-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="id_organizacion">Organization (optional)</label>
                        <select class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-shadow" id="id_organizacion" name="id_organizacion">
                            <option value="" selected="">No organization (personal use)</option>
                            <!-- Opciones desde safecore_iot.organizaciones (tabla vacía: insertar organizaciones primero) -->
                        </select>
                    </div>
                    <div class="flex items-start gap-3 mt-stack-md">
                        <div class="flex items-center h-6">
                            <input class="h-4 w-4 rounded border-outline-variant text-primary-container focus:ring-primary-container bg-surface-bright cursor-pointer" id="terms" name="terms" required="" type="checkbox" />
                        </div>
                        <div class="text-sm leading-6">
                            <label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                                I agree to the <a class="font-label-md text-label-md text-primary-container hover:text-secondary-container transition-colors underline decoration-primary-container/30 hover:decoration-secondary-container" href="#">Terms of Service</a> and <a class="font-label-md text-label-md text-primary-container hover:text-secondary-container transition-colors underline decoration-primary-container/30 hover:decoration-secondary-container" href="#">Privacy Policy</a>.
                            </label>
                        </div>
                    </div>
                    <div class="pt-stack-sm">
                        <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all hover:-translate-y-[1px]" type="submit">
                            Create Account
                        </button>
                    </div>
                </form>
                <div class="mt-stack-lg text-center">
                    <p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account?
                        <a class="font-label-md text-label-md text-primary-container hover:text-secondary-container transition-colors ml-1" href="#">Login</a>
                    </p>
                </div>
            </div>
        </main>
        <!-- Suppressed Footer due to transactional page intent (Registration) -->
    </body>
</html>
