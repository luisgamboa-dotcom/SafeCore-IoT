<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Iniciar sesión - SafeCore IoT</title>
        <link rel="icon" type="image/png" href="/public/images/logo-icon.png">
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "surface-bright": "#F6F1FF",
                            "on-secondary": "#ffffff",
                            "surface-variant": "#D9C9FF",
                            "surface-container-lowest": "#ffffff",
                            "error": "#ba1a1a",
                            "outline": "#74777f",
                            "error-container": "#ffdad6",
                            "on-primary-fixed-variant": "#4A357A",
                            "tertiary-container": "#5B4A8A",
                            "on-tertiary": "#ffffff",
                            "surface-container-high": "#E2D5FF",
                            "on-tertiary-container": "#A37FFF",
                            "tertiary-fixed-dim": "#C4AFFF",
                            "surface-container": "#E9DEFF",
                            "on-background": "#191c1f",
                            "surface": "#F6F1FF",
                            "on-secondary-fixed-variant": "#6D3DF5",
                            "on-error": "#ffffff",
                            "primary-fixed": "#E9DEFF",
                            "surface-dim": "#d8dade",
                            "primary-fixed-dim": "#C9B0FF",
                            "on-secondary-container": "#fffbff",
                            "surface-container-highest": "#D9C9FF",
                            "secondary": "#6D3DF5",
                            "on-error-container": "#93000a",
                            "surface-tint": "#7A5CA8",
                            "tertiary": "#3D2A63",
                            "on-tertiary-fixed-variant": "#4A357A",
                            "on-secondary-fixed": "#2E1B5A",
                            "on-tertiary-fixed": "#2E1B5A",
                            "on-surface-variant": "#43474e",
                            "inverse-surface": "#2d3134",
                            "tertiary-fixed": "#E5DBFF",
                            "on-primary-container": "#D9C8FF",
                            "outline-variant": "#c4c6cf",
                            "on-primary-fixed": "#2E1B5A",
                            "primary": "#2E1B5A",
                            "background": "#F6F1FF",
                            "secondary-fixed-dim": "#D5C2FF",
                            "secondary-fixed": "#EDE6FF",
                            "secondary-container": "#A37FFF",
                            "on-primary": "#ffffff",
                            "inverse-on-surface": "#eff1f5",
                            "surface-container-low": "#EFE7FF",
                            "primary-container": "#8751F8",
                            "inverse-primary": "#C9B0FF",
                            "on-surface": "#191c1f"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "container-max": "1280px",
                            "stack-lg": "32px",
                            "gutter": "24px",
                            "margin-mobile": "16px",
                            "stack-sm": "8px",
                            "stack-md": "16px",
                            "margin-desktop": "40px",
                            "stack-xs": "4px",
                            "stack-xl": "64px"
                        },
                        "fontFamily": {
                            "headline-sm": ["Inter"],
                            "display-lg": ["Inter"],
                            "body-md": ["Inter"],
                            "headline-md": ["Inter"],
                            "body-lg": ["Inter"],
                            "display-lg-mobile": ["Inter"],
                            "label-sm": ["Inter"],
                            "label-md": ["Inter"]
                        },
                        "fontSize": {
                            "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "headline-md": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                            "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="/public/styles/loginStyles.css">
    </head>
    <body class="min-h-screen flex items-center justify-center font-body-md text-on-surface bg-background">
        <div class="w-full max-w-md p-stack-lg bg-surface-container-lowest rounded-xl shadow-[0_10px_30px_rgba(135,81,248,0.05)] border border-outline-variant/20 mx-margin-mobile">
            <div class="flex flex-col items-center mb-stack-lg">
                <a href="/home" aria-label="SafeCore IoT inicio">
                    <img alt="SafeCore IoT" class="h-36 w-auto object-contain mb-stack-sm" style="max-width:240px" src="/public/images/logo-vertical.png" />
                </a>
                <h1 class="font-headline-md text-headline-md text-primary">Iniciar sesión</h1>
                <p class="text-on-surface-variant font-body-md mt-stack-xs">Panel de monitoreo seguro</p>
            </div>
            {% include "partials/toast.html" %}
            <form class="space-y-stack-md" action="/users/login" method="POST">
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-stack-xs" for="email">Correo electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline">mail</span>
                        </div>
                        <input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-bright text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors duration-200" id="email" name="email" placeholder="admin@safecore.io" required="" type="email" value="{{ old.email or '' }}" />
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-stack-xs" for="password">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline">lock</span>
                        </div>
                        <input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-bright text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password" />
                    </div>
                </div>
                <div class="flex items-center justify-between pt-stack-xs">
                    <div class="flex items-center">
                        <input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox" />
                        <label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Recuérdame
                        </label>
                    </div>
                    <div class="text-label-md">
                        <a class="font-medium text-secondary hover:text-secondary-container transition-colors" href="/users/recuperar">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>
                <button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                    <span class="material-symbols-outlined mr-2 text-sm">login</span>
                    Iniciar sesión
                </button>
            </form>
            <div class="mt-stack-lg text-center">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    ¿No tienes una cuenta?
                    <a class="font-medium text-secondary hover:text-secondary-container transition-colors" href="/users/register">Regístrate aquí</a>
                </p>
            </div>
        </div>
        <script src="/public/scripts/sidebarToggle.js"></script>
    </body>
</html>
