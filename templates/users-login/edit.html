<form action="/users/{{ user.id_usuario }}/edit" method="POST">
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" value="{{ user.email }}" required>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ user.nombre }}" required>
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" value="{{ user.apellido }}" required>
    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" value="{{ user.telefono }}" required>
    <label for="id_organizacion">ID Organización:</label>
    <input type="text" id="id_organizacion" name="id_organizacion" value="{{ user.id_organizacion }}" required>
    <button type="submit">Actualizar</button>
</form>
